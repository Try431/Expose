<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
	<head>
		<meta http-equiv="X-UA-Compatible" content="IE=Edge"/>
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1">
	    <meta property='og:title' content='{{og_title}}'/>
	    <meta property='og:image' content='{{og_image}}'/>
	    <meta property='og:description' content='{{og_description}}'/>
	    <meta property='og:url' content='{{og_url}}'/>

		<title>{{sitetitle}} - {{gallerytitle}}</title>
		<link href='https://fonts.googleapis.com/css?family=Lato:300,100' rel='stylesheet' type='text/css' />
		<link type="text/css" rel="stylesheet" media="all" href="{{basepath}}global.css?v=20261026" />
		<link rel="icon" href="{{basepath}}img/favicon.png">
		<script src="{{basepath}}json.js"></script>
		<script src="{{basepath}}jquery.min.js"></script>
		<script src="{{basepath}}cookie.js"></script>
		<script src="{{basepath}}nav.js?v=20261026"></script>
		<script src="{{basepath}}site.js?v=20261026"></script>
		<script src="{{basepath}}viewer.js?v=20261026"></script>
		<script src="{{basepath}}global.js?v=20261026"></script>
	</head>
<body data-resolution="{{resolution}}" data-respath="{{resourcepath}}">

<ol id="marker">
</ol>

<div id="video_script">
	<script type="text/javascript">
		$(document).ready(function(){
		  $("video").prop("autoplay",true);
		  $("video").prop("muted",true);
		});
	</script>
</div>

<div id="sidebar">
	<div class="foreground">
		<div id="profile" class="camera icon"></div>
		<h1><a href="/">{{sitetitle}}</a></h1>
		<ul id="nav"></ul>
	</div>

	<ul id="control">
	<li><a href="#" id="resbutton"><span class="monitor icon"></span><span class="restext"></span></a></li>
	<li style="display: {{text_toggle}}"><a href="#" id="textbutton" class="active"><span class="toggle icon"></span><span class="text">hide text</span></a></li>
	</ul>

	<div class="background"></div>
</div>

<div id="resolution">
</div>

<div id="main">
	{{content}}
</div>

</body>
</html>
